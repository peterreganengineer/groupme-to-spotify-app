<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Apple Music Playlist</title>
    <script src="https://js-cdn.music.apple.com/musickit/v1/musickit.js"></script>
  </head>
  <body>
    <h1>Create Apple Music Playlist</h1>
    <label for="playlist_name">Enter playlist name:</label><br />
    <input type="text" id="playlist_name" /><br /><br />
    <button onclick="createPlaylist()">Create Playlist</button>

    <script>
      async function fetchDeveloperToken() {
        try {
          const response = await fetch("http://127.0.0.1:5000/developer-token"); // Change the URL to match your Flask server
          const data = await response.json();
          return data.developer_token;
        } catch (error) {
          console.error("Error fetching developer token:", error);
          return null;
        }
      }

      async function createPlaylist() {
        const playlistName = document.getElementById("playlist_name").value;
        if (!playlistName) {
          alert("Please enter a playlist name.");
          return;
        }

        try {
        const token = await fetchDeveloperToken();
          await MusicKit.configure({
            developerToken: token,
            app: {
              name: "Peter's MusicKit App",
              build: "1978.4.1",
            },
          });
          console.log("test");
          // MusicKit instance is available
          const music = MusicKit.getInstance();

          const musicKitToken = await music.authorize();
          const response = await createPlaylistRequest(
            playlistName,
            developerToken,
            musicKitToken
          );
          if (response.status === 201) {
            alert(`Playlist '${playlistName}' created successfully!`);
          } else {
            const errorMessage = await response.json();
            alert(
              `Failed to create playlist: ${errorMessage.errors[0].detail}`
            );
          }
        } catch (error) {
          console.error("Error:", error);
          alert("An error occurred. Check the console for details.");
        }
      }

      async function createPlaylistRequest(
        playlistName,
        developerToken,
        musicKitToken
      ) {
        const url = "https://api.music.apple.com/v1/me/library/playlists";
        const headers = {
          Authorization: `Bearer ${developerToken}`,
          "Music-User-Token": musicKitToken,
          "Content-Type": "application/json",
        };
        const payload = {
          attributes: {
            name: playlistName,
            description: `Playlist created with the name ${playlistName}`,
          },
        };
        return fetch(url, {
          method: "POST",
          headers: headers,
          body: JSON.stringify(payload),
        });
      }
    </script>
  </body>
</html>
